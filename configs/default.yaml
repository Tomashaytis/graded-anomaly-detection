# Training configuration
training:
  num_epochs: 20
  batch_size: 8
  num_workers: 2
  learning_rate: 0.0001
  weight_decay: 0.001
  label_smoothing: 0.1
  accumulate_grad_batches: 4
  num_optional_augmentations: 2
  scheduler: "cosine"  # cosine, step, plateau
  optimizer: "adamw"   # adamw, sgd
  seed: 42

# Model configuration
model:
  preset: "x3d_m_mh"  # i3d_r50, slowfast_r50, x3d_xs, x3d_s, x3d_m, x3d_l, i3d_r50_mh, slowfast_r50_mh, x3d_m_mh

# Model presets
model_presets:
  i3d_r50:
    name: "i3d_r50"
    multi_head_mode: false
    weights_path: "models/3d-cnn/I3D_8x8_R50.pyth"
    freeze_backbone: true
    dropout: 0.5
    batch_size: 4
    accumulate_grad_batches: 4

  x3d_xs:
    name: "x3d_xs"
    multi_head_mode: false
    weights_path: "models/3d-cnn/X3D_XS.pyth"
    freeze_backbone: true
    dropout: 0.5
    batch_size: 16
    accumulate_grad_batches: 2

  x3d_s:
    name: "x3d_s"
    multi_head_mode: false
    weights_path: "models/3d-cnn/X3D_S.pyth"
    freeze_backbone: true
    dropout: 0.5
    batch_size: 8
    accumulate_grad_batches: 4

  x3d_m:
    name: "x3d_m"
    multi_head_mode: false
    weights_path: "models/3d-cnn/X3D_M.pyth"
    freeze_backbone: true
    dropout: 0.5
    batch_size: 4
    accumulate_grad_batches: 8

  x3d_l:
    name: "x3d_l"
    multi_head_mode: false
    weights_path: "models/3d-cnn/X3D_L.pyth"
    freeze_backbone: true
    dropout: 0.5
    batch_size: 2
    accumulate_grad_batches: 16

  slowfast_r50:
    name: "slowfast_r50"
    multi_head_mode: false
    weights_path: "models/3d-cnn/SLOWFAST_8x8_R50.pyth"
    freeze_backbone: true
    dropout: 0.5
    batch_size: 4
    accumulate_grad_batches: 8

  i3d_r50_mh:
    name: "i3d_r50_mh"
    multi_head_mode: true
    weights_path: "models/3d-cnn/I3D_8x8_R50.pyth"
    freeze_backbone: true
    dropout: 0.5
    batch_size: 8
    accumulate_grad_batches: 4

  slowfast_r50_mh:
    name: "slowfast_r50_mh"
    multi_head_mode: true
    weights_path: "models/3d-cnn/SLOWFAST_8x8_R50.pyth"
    freeze_backbone: true
    dropout: 0.5
    batch_size: 8
    accumulate_grad_batches: 4

  x3d_m_mh:
    name: "x3d_m_mh"
    multi_head_mode: true
    weights_path: "models/3d-cnn/X3D_M.pyth"
    freeze_backbone: true
    dropout: 0.5
    batch_size: 8
    accumulate_grad_batches: 4

# Data configuration
data:
  video_frame_size: 224
  video_max_frames: 32

# Paths
paths:
  dataset: "data/dataset"
  annotations_all: "data/dataset/annotations_all.csv"
  annotations_train: "data/dataset/annotations_train.csv"
  annotations_val: "data/dataset/annotations_val.csv"
  annotations_test: "data/dataset/annotations_test.csv"
  id2label: "data/dataset/id2label.json"
  train_lmdb: "F:/Projects/actions-data/train_lmdb"
  val_lmdb: "F:/Projects/actions-data/val_lmdb"
  test_lmdb: "F:/Projects/actions-data/test_lmdb"
  output_dir: "runs/model=X3D-M"
  checkpoint: "runs/model=I3D-8x8-R50/run-4 (mh)/checkpoints/best-epoch=09-val_acc2_mh=0.824.ckpt"

# Logging
logging:
  log_interval: 100
  save_best: true
  save_latest: true
  tensorboard: true
  csv: true

# Early stopping
early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.001

# LMDB
lmdb:
  create_train: false
  create_val: false
  create_test: false
  train_size: 500
  val_size: 100
  test_size: 100

annotation:
  train_ratio: 0.7
  val_ratio: 0.15
  stratify_by_class: true
  seed: 42