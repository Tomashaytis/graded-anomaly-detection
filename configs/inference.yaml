# Preprocessing configuration
preprocessing:
  window_size_sec: 15.0
  tracker: 'bytetrack'  # bytetrack, botsort, deepsort
  reid_path: null
  detector_path: "models/detector/yolo/yolov8m.pt"
  min_track_length: 10
  group_method: "hdbscan"  # spectral, dbscan, hdbscan
  n_top: 2
  n_random: 1
  global_first: True

# Postprocessing configuration
postprocessing:
  global_danger_threshold: 0.5
  local_danger_threshold: 0.3

# Model configuration
model:
  id2label_path: "data/dataset/id2label.json"
  preset: "i3d_f32_mh"
  available_presets:
    - i3d_f32_mh
    - slowfast_f32_mh
    - x3dm_f32_mh
    - timesformer_f32_mh
    - timesformer_f16_mh
    - videomae_f16_mh

# Model presets
model_presets:
  i3d_f32_mh:
    checkpoint_path: "runs/best_checkpoints/best-i3d-f32-mh-mae1=0.106-acc2=0.806.ckpt"
    video_frame_size: 224
    video_n_frames: 32
    batch_size: 4
    dropout: 0.5

  slowfast_f32_mh:
    checkpoint_path: "runs/best_checkpoints/best-slowfast-f32-mh-mae1=0.104-acc2=0.816.ckpt"
    video_frame_size: 224
    video_n_frames: 32
    batch_size: 4
    dropout: 0.5

  x3dm_f32_mh:
    checkpoint_path: "runs/best_checkpoints/best-x3dm-f32-mh-mae1=0.093-acc2=0.817.ckpt"
    video_frame_size: 224
    video_n_frames: 32
    batch_size: 4
    dropout: 0.5

  timesformer_f32_mh:
    checkpoint_path: "runs/best_checkpoints/best-timesformer-f32-mh-mae1=0.077-acc2=0.850.ckpt"
    video_frame_size: 224
    video_n_frames: 32
    batch_size: 4
    dropout: 0.5

  timesformer_f16_mh:
    checkpoint_path: "runs/best_checkpoints/best-timesformer-f16-mh-mae1=0.088-acc2=0.855.ckpt"
    video_frame_size: 224
    video_n_frames: 16
    batch_size: 4
    dropout: 0.5

  videomae_f16_mh:
    checkpoint_path: "runs/best_checkpoints/best-videomae-f16-mh-mae1=0.118-acc2=0.789.ckpt"
    video_frame_size: 224
    video_n_frames: 16
    batch_size: 4
    dropout: 0.5

# Danger levels
danger_levels:
  0:
    name: "normal"
    weight: 0.0
  1:
    name: "context"
    weight: 0.4
  2:
    name: "low"
    weight: 0.7
  3:
    name: "high"
    weight: 1.0

# Actions
action_categories:
  normal:
